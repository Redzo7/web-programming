<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections</title>
    <style>
        div {
            width: 100%;
        }

        input {
            margin: auto;
            text-align: center;
            padding: 10px 15px;
            background-color: lightblue;
            color: darkblue;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }
        .game_word {
            display: inline;
            border: 1px solid lightgray;
            border-radius: 15px;
            background-color: lightgray;
            padding: 10px 15px;
            margin: 20px;
            cursor: pointer;
            font-weight: bold;
            width: 25%;
        }

        .game_row {
            margin-top: 30px;
            width: 75%;
        }

        .selected {
            background-color: green;
        }
    </style>
</head>
<body>
    <div id="main_page">
        <input type="button" value="Start game" id="start">
    </div>
    <div id="game_page">
        <input type="button" value="Back to main menu" id="back">
    </div>
    <div id="results_page">Results</div>

    <script type="module" src="navigation.js"></script>
    <script type="module" src="utils.js"></script>
    <script type="module" src="data.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
